[project]
site_name = "CircusWiki"
site_url = "https://nica-ev.github.io/circuswiki/"
site_author = "Marc Bielert"
site_description = "A wiki dedicated to circus pedagogy, circus arts, education, movement games, and related topics."
copyright = "CC BY-SA 4.0"
repo_url = "https://github.com/nica-ev/circuswiki"
repo_name = "nica-ev/circuswiki"
docs_dir = ".build/de"
site_dir = "site"
extra_css = ["stylesheets/circuswiki.css"]
extra_javascript = ["javascripts/site-theme.js", "javascripts/table-sorter.js", "javascripts/language-switcher.js", "javascripts/translation-status.js", "javascripts/analytics-consent.js"]

nav = [
  { "Home" = "index.md" },
  { "NICA e.V." = "Dokumentation Nica eV.md" },
  { "Bewegungs-Spiele" = "Bewegungs-Spiele.md" },
  { "Liste aller Spiele" = "Liste aller Spiele.md" },
  { "Erasmus+ Project" = "Lets-talk-about-inclusive-circus-practice.md" },
  { "Mitmachen" = "mitmachen.md" },
]

[project.extra]
alternate = [
  { name = "Deutsch", link = "/circuswiki/", lang = "de" },
  { name = "English", link = "/circuswiki/en/", lang = "en" },
  { name = "Polski", link = "/circuswiki/pl/", lang = "pl" },
  { name = "Magyar", link = "/circuswiki/hu/", lang = "hu" },
  { name = "Italiano", link = "/circuswiki/it/", lang = "it" },
  { name = "Nederlands", link = "/circuswiki/nl/", lang = "nl" },
  { name = "Ελληνικά", link = "/circuswiki/el/", lang = "el" },
  { name = "Español", link = "/circuswiki/es/", lang = "es" },
  { name = "Українська", link = "/circuswiki/uk/", lang = "uk" },
  { name = "Português", link = "/circuswiki/pt/", lang = "pt" },
  { name = "Česky", link = "/circuswiki/cs/", lang = "cs" },
  { name = "Slovenčina", link = "/circuswiki/sk/", lang = "sk" },
]

[project.theme]
variant = "modern"
language = "de"
features = [
  "content.tooltips",
  "navigation.instant",
  "navigation.top",
  "navigation.tracking",
  "toc.follow",
  "search.suggest",
  "search.highlight",
]

[project.markdown_extensions.nl2br]

[project.markdown_extensions.admonition]

[project.markdown_extensions.attr_list]

[project.markdown_extensions.md_in_html]

[project.markdown_extensions.zensical.extensions.preview]
configurations = [
  { targets.include = ["*", "**/*"], targets.exclude = ["_*", "__*", "_*/*", "__*/*"] },
]

[project.markdown_extensions.tables]

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.blocks.caption]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
